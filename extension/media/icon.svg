<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4D"/>
      <stop offset="100%" stop-color="#001437"/>
    </linearGradient>

    <!-- Orange -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>

    <!-- Blue -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88FF"/>
      <stop offset="100%" stop-color="#004BBA"/>
    </linearGradient>

    <!-- Glass -->
    <radialGradient id="glass" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4FC3FF"/>
      <stop offset="100%" stop-color="#002D6B"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main Rounded Background -->
  <rect x="20" y="20" width="472" height="472" rx="48" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- White Panel -->
  <rect x="40" y="40" width="432" height="320" rx="28" fill="#F5F7FB"/>

  <!-- Java Steam -->
  <path d="M210 90
           C260 30, 310 90, 250 150
           C220 180, 250 210, 260 230"
        fill="none"
        stroke="#FF4D00"
        stroke-width="18"
        stroke-linecap="round"/>

  <path d="M280 110
           C330 60, 360 110, 320 160
           C300 190, 320 220, 330 240"
        fill="none"
        stroke="#FF4D00"
        stroke-width="16"
        stroke-linecap="round"/>

  <!-- Java Rings -->
  <ellipse cx="210" cy="250" rx="120" ry="18"
           fill="none"
           stroke="url(#blueGrad)"
           stroke-width="12"/>

  <ellipse cx="240" cy="290" rx="90" ry="14"
           fill="none"
           stroke="url(#blueGrad)"
           stroke-width="10"/>

  <ellipse cx="250" cy="325" rx="140" ry="18"
           fill="none"
           stroke="url(#blueGrad)"
           stroke-width="12"/>

  <!-- Magnifying Glass -->
  <circle cx="345" cy="230" r="85"
          fill="url(#glass)"
          stroke="url(#orangeGrad)"
          stroke-width="12"
          filter="url(#shadow)"/>

  <!-- Handle -->
  <rect x="390" y="295" width="95" height="28" rx="14"
        transform="rotate(45 390 295)"
        fill="url(#orangeGrad)"/>

  <!-- Maven Cube -->
  <g transform="translate(300 180)">
    <!-- Top -->
    <polygon points="45,0 90,25 45,50 0,25"
             fill="#FFFFFF"/>

    <!-- Left -->
    <polygon points="0,25 45,50 45,100 0,75"
             fill="#FF5A1F"/>

    <!-- Right -->
    <polygon points="90,25 45,50 45,100 90,75"
             fill="#0066E8"/>

    <!-- Bottom -->
    <polygon points="0,75 45,100 90,75 45,125"
             fill="#003A91"/>
  </g>

  <!-- Bottom Bar -->
  <rect x="20" y="360" width="472" height="132" rx="0 0 48 48"
        fill="#001B4D"/>

  <!-- MavenScope Text -->
  <text x="256" y="445"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        fill="#FFFFFF">
    Maven<tspan fill="url(#orangeGrad)">Scope</tspan>
  </text>
</svg>