<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" fill="none" role="img" aria-label="JAR">
  <defs>
    <linearGradient id="jar-page" x1="4" y1="2" x2="28" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="jar-fold" x1="22" y1="2" x2="30" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="jar-bar" x1="2" y1="30" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Page -->
  <rect x="3" y="2" width="26" height="36" rx="2.5" fill="url(#jar-page)" stroke="#d1d5db" stroke-width="0.8"/>
  <!-- Folded corner -->
  <path d="M22 2h7v7l-7-7z" fill="url(#jar-fold)"/>
  <path d="M22 2l7 7" stroke="#c2410c" stroke-width="0.6" opacity="0.5"/>
  <!-- Java steam -->
  <path d="M12.5 11c.8-1.6 1.7-1.6 2.5 0 .8 1.6 1.7 1.6 2.5 0" stroke="#f97316" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Java cup -->
  <path d="M9 18.5h14" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M10 18.5c0-3 1.2-5.5 3-5.5s3 2.5 3 5.5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M19 18.5c0-3 1.2-5.5 3-5.5s3 2.5 3 5.5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M8.5 20h15" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
  <!-- JAR label bar -->
  <rect x="3" y="29" width="26" height="9" fill="url(#jar-bar)" clip-path="url(#jar-clip)"/>
  <clipPath id="jar-clip">
    <rect x="3" y="2" width="26" height="36" rx="2.5"/>
  </clipPath>
  <text x="16" y="35.5" text-anchor="middle" fill="#ffffff" font-family="system-ui, Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.5">JAR</text>
</svg>
